name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前哪里不好用，或缺少什么能力
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以描述交互、数据字段或 API
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
